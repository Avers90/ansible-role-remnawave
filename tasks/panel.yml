---
- name: remnawave | panel | Create install directory
  ansible.builtin.file:
    path: "{{ remnawave_install_dir }}"
    state: directory
    mode: "0750"
    owner: root
    group: root

- name: remnawave | panel | Generate JWT auth secret
  ansible.builtin.set_fact:
    remnawave_jwt_auth_secret_value: "{{ remnawave_jwt_auth_secret }}"
  when: remnawave_jwt_auth_secret | length > 0

- name: remnawave | panel | Auto-generate JWT auth secret
  ansible.builtin.shell:
    cmd: openssl rand -hex 32
  register: remnawave_jwt_auth_secret_gen
  changed_when: false
  when: remnawave_jwt_auth_secret | length == 0

- name: remnawave | panel | Set JWT auth secret fact
  ansible.builtin.set_fact:
    remnawave_jwt_auth_secret_value: "{{ remnawave_jwt_auth_secret_gen.stdout }}"
  when: remnawave_jwt_auth_secret | length == 0

- name: remnawave | panel | Generate JWT API tokens secret
  ansible.builtin.set_fact:
    remnawave_jwt_api_tokens_secret_value: "{{ remnawave_jwt_api_tokens_secret }}"
  when: remnawave_jwt_api_tokens_secret | length > 0

- name: remnawave | panel | Auto-generate JWT API tokens secret
  ansible.builtin.shell:
    cmd: openssl rand -hex 32
  register: remnawave_jwt_api_tokens_secret_gen
  changed_when: false
  when: remnawave_jwt_api_tokens_secret | length == 0

- name: remnawave | panel | Set JWT API tokens secret fact
  ansible.builtin.set_fact:
    remnawave_jwt_api_tokens_secret_value: "{{ remnawave_jwt_api_tokens_secret_gen.stdout }}"
  when: remnawave_jwt_api_tokens_secret | length == 0

- name: remnawave | panel | Generate postgres password
  ansible.builtin.set_fact:
    remnawave_postgres_password_value: "{{ remnawave_postgres_password }}"
  when: remnawave_postgres_password | length > 0

- name: remnawave | panel | Auto-generate postgres password
  ansible.builtin.shell:
    cmd: openssl rand -hex 24
  register: remnawave_postgres_password_gen
  changed_when: false
  when: remnawave_postgres_password | length == 0

- name: remnawave | panel | Set postgres password fact
  ansible.builtin.set_fact:
    remnawave_postgres_password_value: "{{ remnawave_postgres_password_gen.stdout }}"
  when: remnawave_postgres_password | length == 0

- name: remnawave | panel | Generate metrics password
  ansible.builtin.set_fact:
    remnawave_metrics_pass_value: "{{ remnawave_metrics_pass }}"
  when: remnawave_metrics_pass | length > 0

- name: remnawave | panel | Auto-generate metrics password
  ansible.builtin.shell:
    cmd: openssl rand -hex 16
  register: remnawave_metrics_pass_gen
  changed_when: false
  when: remnawave_metrics_pass | length == 0

- name: remnawave | panel | Set metrics password fact
  ansible.builtin.set_fact:
    remnawave_metrics_pass_value: "{{ remnawave_metrics_pass_gen.stdout }}"
  when: remnawave_metrics_pass | length == 0

- name: remnawave | panel | Set subscription public domain
  ansible.builtin.set_fact:
    remnawave_sub_public_domain_value: >-
      {{ remnawave_sub_public_domain
         if remnawave_sub_public_domain | length > 0
         else remnawave_domain ~ '/api/sub' }}

- name: remnawave | panel | Deploy .env file
  ansible.builtin.template:
    src: panel.env.j2
    dest: "{{ remnawave_install_dir }}/.env"
    mode: "0600"
    owner: root
    group: root
  no_log: true
  notify: Restart remnawave

- name: remnawave | panel | Deploy docker-compose.yml
  ansible.builtin.template:
    src: panel-compose.yml.j2
    dest: "{{ remnawave_install_dir }}/docker-compose.yml"
    mode: "0644"
    owner: root
    group: root
  notify: Restart remnawave

- name: remnawave | panel | Start panel containers
  community.docker.docker_compose_v2:
    project_src: "{{ remnawave_install_dir }}"
    state: present
    pull: missing

- name: remnawave | panel | Wait for backend to be ready
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ remnawave_app_port }}"
    delay: 5
    timeout: 60
    state: started
