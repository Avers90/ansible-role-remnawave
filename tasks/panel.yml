---
- name: remnawave | panel | Create install directory
  ansible.builtin.file:
    path: "{{ remnawave_install_dir }}"
    state: directory
    mode: "0750"
    owner: root
    group: root

- name: remnawave | panel | Resolve secrets and computed variables
  ansible.builtin.set_fact:
    remnawave_jwt_auth_secret_value: "{{ remnawave_jwt_auth_secret | default(lookup('pipe', 'openssl rand -hex 64'), true) }}"
    remnawave_jwt_api_tokens_secret_value: "{{ remnawave_jwt_api_tokens_secret | default(lookup('pipe', 'openssl rand -hex 64'), true) }}"
    remnawave_postgres_password_value: "{{ remnawave_postgres_password | default(lookup('pipe', 'openssl rand -hex 24'), true) }}"
    remnawave_metrics_pass_value: "{{ remnawave_metrics_pass | default(lookup('pipe', 'openssl rand -hex 16'), true) }}"
    remnawave_webhook_secret_header_value: "{{ remnawave_webhook_secret_header | default(lookup('pipe', 'openssl rand -hex 64'), true) }}"
    remnawave_sub_public_domain_value: "{{ remnawave_sub_public_domain if remnawave_sub_public_domain | length > 0 else remnawave_domain ~ '/api/sub' }}"

- name: remnawave | panel | Deploy .env file
  ansible.builtin.template:
    src: panel.env.j2
    dest: "{{ remnawave_install_dir }}/.env"
    mode: "0600"
    owner: root
    group: root
  no_log: true
  notify: Restart remnawave

- name: remnawave | panel | Deploy docker-compose.yml
  ansible.builtin.template:
    src: panel-compose.yml.j2
    dest: "{{ remnawave_install_dir }}/docker-compose.yml"
    mode: "0644"
    owner: root
    group: root
  notify: Restart remnawave

- name: remnawave | panel | Start panel containers
  community.docker.docker_compose_v2:
    project_src: "{{ remnawave_install_dir }}"
    state: present
    pull: missing

- name: remnawave | panel | Wait for backend to be ready
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ remnawave_app_port }}"
    delay: 5
    timeout: 60
    state: started
