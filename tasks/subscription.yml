---
- name: remnawave | subscription | Fail if subscription page domain is not set
  ansible.builtin.fail:
    msg: "remnawave_subscription_page_domain must be set when remnawave_subscription_page_enabled: true"
  when: remnawave_subscription_page_domain | length == 0

- name: remnawave | subscription | Fail if subscription page API token is not set
  ansible.builtin.fail:
    msg: "remnawave_subscription_page_api_token must be set when remnawave_subscription_page_enabled: true"
  when: remnawave_subscription_page_api_token | length == 0

- name: remnawave | subscription | Create subscription page directory
  ansible.builtin.file:
    path: "{{ remnawave_subscription_page_dir }}"
    state: directory
    mode: "0750"
    owner: root
    group: root

- name: remnawave | subscription | Deploy .env file
  ansible.builtin.template:
    src: subscription.env.j2
    dest: "{{ remnawave_subscription_page_dir }}/.env"
    mode: "0600"
    owner: root
    group: root
  no_log: true
  notify: Restart remnawave-subscription-page

- name: remnawave | subscription | Deploy docker-compose.yml
  ansible.builtin.template:
    src: subscription-compose.yml.j2
    dest: "{{ remnawave_subscription_page_dir }}/docker-compose.yml"
    mode: "0644"
    owner: root
    group: root
  notify: Restart remnawave-subscription-page

- name: remnawave | subscription | Start subscription page container
  community.docker.docker_compose_v2:
    project_src: "{{ remnawave_subscription_page_dir }}"
    state: present
    pull: "{{ remnawave_pull_policy }}"

- name: remnawave | subscription | Wait for subscription page to be ready
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ remnawave_subscription_page_port }}"
    delay: 3
    timeout: 30
    state: started
