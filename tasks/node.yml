---
- name: remnawave | node | Create node directory
  ansible.builtin.file:
    path: "{{ remnawave_node_dir }}"
    state: directory
    mode: "0750"
    owner: root
    group: root

- name: remnawave | node | Set node secret key fact
  ansible.builtin.set_fact:
    remnawave_node_secret_key_value: "{{ remnawave_node_secret_key }}"
  # If vault_remnawave_node_secret_key is set — it will be written to .env on fresh deploy.
  # If empty — SECRET_KEY will be blank; node won't start until key is obtained from panel UI
  # (Nodes → Add Node → copy SECRET_KEY → paste into /opt/remnanode/.env → restart container).

- name: remnawave | node | Deploy .env file
  ansible.builtin.template:
    src: node.env.j2
    dest: "{{ remnawave_node_dir }}/.env"
    mode: "0600"
    owner: root
    group: root
    force: false
  no_log: true

# Russia geo-files must be downloaded BEFORE starting the container
# because they are bind-mounted into the node container at startup
- name: remnawave | node | Create geo-files directory
  ansible.builtin.file:
    path: "{{ remnawave_geo_dir }}"
    state: directory
    mode: "0755"
    owner: root
    group: root
  when: remnawave_geo_russia_enabled | bool

- name: remnawave | node | Download geoip.dat
  ansible.builtin.get_url:
    url: "{{ remnawave_geo_geoip_url }}"
    dest: "{{ remnawave_geo_dir }}/geoip.dat"
    mode: "0644"
    owner: root
    group: root
    force: true
  when: remnawave_geo_russia_enabled | bool

- name: remnawave | node | Download geosite.dat
  ansible.builtin.get_url:
    url: "{{ remnawave_geo_geosite_url }}"
    dest: "{{ remnawave_geo_dir }}/geosite.dat"
    mode: "0644"
    owner: root
    group: root
    force: true
  when: remnawave_geo_russia_enabled | bool

- name: remnawave | node | Deploy docker-compose.yml
  ansible.builtin.template:
    src: node-compose.yml.j2
    dest: "{{ remnawave_node_dir }}/docker-compose.yml"
    mode: "0644"
    owner: root
    group: root
  notify: Restart remnanode

- name: remnawave | node | Start node container
  community.docker.docker_compose_v2:
    project_src: "{{ remnawave_node_dir }}"
    state: present
    pull: missing

- name: remnawave | node | Deploy cron job for geo-file updates
  ansible.builtin.cron:
    name: "Update russia v2ray geo files"
    hour: "{{ remnawave_geo_cron_hour }}"
    minute: "{{ remnawave_geo_cron_minute }}"
    job: >-
      curl -fsSL {{ remnawave_geo_geoip_url }} -o {{ remnawave_geo_dir }}/geoip.dat &&
      curl -fsSL {{ remnawave_geo_geosite_url }} -o {{ remnawave_geo_dir }}/geosite.dat
    state: present
  when: remnawave_geo_russia_enabled | bool and remnawave_geo_cron_enabled | bool

- name: remnawave | node | Remove cron job for geo-file updates
  ansible.builtin.cron:
    name: "Update russia v2ray geo files"
    state: absent
  when: not (remnawave_geo_russia_enabled | bool and remnawave_geo_cron_enabled | bool)
