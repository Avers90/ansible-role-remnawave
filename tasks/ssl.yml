---
- name: remnawave | ssl | Install acme.sh dependencies
  ansible.builtin.apt:
    name:
      - curl
      - cron
      - socat
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: remnawave | ssl | Check if acme.sh is installed
  ansible.builtin.stat:
    path: /root/.acme.sh/acme.sh
  register: remnawave_acmesh_stat

- name: remnawave | ssl | Install acme.sh
  ansible.builtin.shell:
    cmd: "curl -fsSL https://get.acme.sh | sh -s email={{ remnawave_ssl_email }}"
    creates: /root/.acme.sh/acme.sh
  when: not remnawave_acmesh_stat.stat.exists

- name: remnawave | ssl | Set default CA to Let's Encrypt
  ansible.builtin.command:
    cmd: /root/.acme.sh/acme.sh --set-default-ca --server letsencrypt
  changed_when: false

- name: remnawave | ssl | Enable acme.sh auto-upgrade
  ansible.builtin.command:
    cmd: /root/.acme.sh/acme.sh --upgrade --auto-upgrade
  changed_when: false
  when: not remnawave_acmesh_stat.stat.exists

- name: remnawave | ssl | Create certificate directory
  ansible.builtin.file:
    path: "{{ remnawave_cert_dir }}"
    state: directory
    mode: "0700"
    owner: root
    group: root

- name: remnawave | ssl | Check if certificate already exists
  ansible.builtin.stat:
    path: "{{ remnawave_cert_dir }}/{{ remnawave_domain }}.cer"
  register: remnawave_cert_stat

# Cloudflare DNS challenge: issues wildcard *.domain + domain
# Webroot challenge: issues single domain only (requires nginx on port 80)
- name: remnawave | ssl | Issue TLS certificate
  ansible.builtin.shell:
    cmd: >
      {% if remnawave_ssl_cloudflare_enabled | bool %}
      CF_Token="{{ remnawave_ssl_cloudflare_token }}"
      {% if remnawave_ssl_cloudflare_zone_id | length > 0 %}CF_Zone_ID="{{ remnawave_ssl_cloudflare_zone_id }}"{% endif %}
      {% endif %}
      /root/.acme.sh/acme.sh --issue
      -d {{ remnawave_domain }}
      {% if remnawave_ssl_cloudflare_enabled | bool %}-d "*.{{ remnawave_domain }}" --dns dns_cf
      {% else %}--webroot /var/www/html
      {% endif %}
      {{ '--force' if remnawave_ssl_force_renew | bool else '' }}
  register: remnawave_cert_issue
  changed_when: "'Cert success' in remnawave_cert_issue.stdout"
  failed_when:
    - remnawave_cert_issue.rc != 0
    - "'Domains not changed' not in remnawave_cert_issue.stdout"
  no_log: "{{ remnawave_ssl_cloudflare_enabled | bool }}"
  when: not remnawave_cert_stat.stat.exists or remnawave_ssl_force_renew | bool

# =====================
# Install certificate (both modes use same paths)
# =====================

- name: remnawave | ssl | Install SSL certificate
  ansible.builtin.command:
    cmd: >
      /root/.acme.sh/acme.sh
      --installcert
      -d {{ remnawave_domain }}
      --cert-file {{ remnawave_cert_dir }}/{{ remnawave_domain }}.cer
      --key-file {{ remnawave_cert_dir }}/{{ remnawave_domain }}.key
      --fullchain-file {{ remnawave_cert_dir }}/{{ remnawave_domain }}-fullchain.cer
      --reloadcmd "docker compose -f {{ remnawave_install_dir }}/docker-compose.yml restart remnawave || true"
  # acme.sh --installcert is idempotent (copies files + registers reloadcmd).
  # Run on every play to keep install paths and reloadcmd up to date.
  # changed_when: false avoids spurious "changed" in normal runs.
  changed_when: false

- name: remnawave | ssl | Fix certificate file permissions
  ansible.builtin.file:
    path: "{{ remnawave_cert_dir }}/{{ item.name }}"
    mode: "{{ item.mode }}"
    owner: root
    group: root
  loop:
    - { name: "{{ remnawave_domain }}.key", mode: "0600" }
    - { name: "{{ remnawave_domain }}.cer", mode: "0644" }
    - { name: "{{ remnawave_domain }}-fullchain.cer", mode: "0644" }
  loop_control:
    label: "{{ item.name }}"

- name: remnawave | ssl | Restart node to reload wildcard certificate
  community.docker.docker_compose_v2:
    project_src: "{{ remnawave_node_dir }}"
    state: restarted
  when:
    - remnawave_node_enabled | bool
    - remnawave_ssl_cloudflare_enabled | bool
    - remnawave_cert_issue is defined and remnawave_cert_issue.changed | default(false)

# Note: subscription page does NOT need its own TLS certificate.
# TLS is terminated by Xray (port 443, network_mode: host).
# Xray forwards plaintext HTTP to nginx 127.0.0.1:8080 via fallback.
# nginx routes by Host header to the subscription page container.
# Wildcard cert (*.domain) issued above covers sub.domain automatically for Xray.
